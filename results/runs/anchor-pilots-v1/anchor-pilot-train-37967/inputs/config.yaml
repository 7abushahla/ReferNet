  brightness_offset: [-0.2, 0.2]
  brightness_units: '255'
  contrast_semantics: multiply_pixels
  clip: uint8_0_255
  interpolation: opencv_inter_linear
  jpeg_quality: null
precision:
  dtype: float32
  amp: false
  cudnn_tf32: false
  matmul_tf32: false
selection:
  primary: accuracy
  tie_break: auc
  exact_tie: earlier_epoch
accumulation_steps: 2
drop_last: false
eval_drop_last: false
wrong_design_fraction: 0.0
comparison: candidate_package
