# Protocol B: train on all 10 MIDV designs, test zero-shot on FantasyID's official test split
protocol: B
data:
  split: data/processed/splits/protocol_b.csv
  canvas: [512, 800]
  reference: design_median
  wrong_design_fraction: 0.1
  report_subsets: [all, text, face, arabic_design]
  calibration_cards: [0, 10]     # for the Arabic design (E3)
model:
  framework: changerex
  backbone: resnet18
  fusion: difference
  init: levir
  transfer: full
train:
  epochs: 40
  batch_size: 8
  lr_backbone: 1.0e-4
  lr_new: 5.0e-3                # Open-CD ChangerEx schedule for new modules
  weight_decay: 0.05
  warmup_iters: 1000
  mask_loss_weight: 3.0
  amp: true
  seeds: [42, 43, 44]
augment:
  canvas_jpeg_quality: 95        # every canvas re-encoded; removes the raw-file quantization-table shortcut
  affine_px: 8
  jpeg_quality: [60, 100]
  photometric: true
eval:
  test_variants: [native, equalized_qf75]   # both classes re-encoded at 75; see docs/conventions.md section 5
  score_orientation: bonafide_high          # 1 = genuine, threshold 0.5 with >= (DeepID)
  threshold_source: source_validation       # bob far_threshold rule at 5 percent miss, then frozen
  metrics: [auc, hter, genuine_referral_at_published_point, eer, apcer_bpcer5, pixel_f1, referral_miss1, referral_miss5, transported_threshold_miss, transported_threshold_referral]
